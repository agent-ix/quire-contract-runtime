# Every feature is in the graph: the shared leaves are optional and enabled only by `exact`.
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# First-party agent-ix crates are AGPL-3.0-or-later (owner decision 2026-09-14,
# agent-ix/quire-contract-runtime#14). Exceptions are scoped to this workspace's
# crates so the third-party allow-list stays permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-runtime" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-runtime-footprint" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-exact" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-semantic-value" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical-derive" },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

# One copy of every first-party crate is enforced by scripts/check_one_copy.awk
# (run from `make deny`), which reads every tracked Cargo.lock.

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only the shared first-party repositories are admitted. QSL's monorepo source is denied.
allow-git = [
    "https://github.com/agent-ix/quire-exact",
    "https://github.com/agent-ix/quire-semantic-value",
    "https://github.com/agent-ix/quire-canonical",
]
