[package]
name = "quire-contract-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Small no_std runtime support for generated contract oracles and harness verdicts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/quire-contract-runtime"

[lib]
name = "quire_contract_runtime"
path = "src/lib.rs"

[workspace]
members = ["measurement/footprint"]
resolver = "2"

[features]
default = []
alloc = []
std = ["alloc"]
proptest = ["std", "dep:proptest"]

[dependencies]
proptest = { version = "=1.5.0", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
