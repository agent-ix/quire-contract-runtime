name: CI

# Manual only. This workflow has never been dispatched and the shared-assurance
# migration did not dispatch it. Local `make ci` is the gate.
on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: make lint

      - name: Test feature matrix
        run: make test-features

      - name: Validate specification
        run: |
          npm install --global '@agent-ix/quire-cli@0.31.0' '@agent-ix/quoin@0.23.1' 'ix-flow@0.0.4'
          quoin module ensure-defaults
          make spec

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

      - name: Panic-surface audit
        run: bash scripts/check_panic_surface.sh

  msrv:
    name: Rust 1.75 surface and footprint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: thumbv7em-none-eabi
      - name: Check full declared surface
        run: make msrv
      - name: Linked release footprint ceiling
        run: make size

  kani:
    name: Kani operator proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove truth tables and definedness boundaries
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"

  assurance:
    name: Shared assurance intake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned shared toolchain
        run: |
          npm install --global '@agent-ix/quire-cli@0.31.0' '@agent-ix/quoin@0.23.1' 'ix-flow@0.0.4'
          quoin module ensure-defaults
      - name: Classify the shared pins through the packaged matrix
        run: make pins

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses
