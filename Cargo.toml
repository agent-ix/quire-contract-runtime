[package]
name = "quire-contract-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Small no_std runtime support for generated contract oracles and harness verdicts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/quire-contract-runtime"

[lib]
name = "quire_contract_runtime"
path = "src/lib.rs"

[workspace]
members = ["measurement/footprint"]
resolver = "2"

[features]
default = []
alloc = []
std = ["alloc"]
proptest = ["std", "dep:proptest"]
snapshot-json = ["alloc", "dep:serde", "dep:serde_json"]
exact = ["alloc", "dep:quire-exact", "dep:num-bigint", "dep:num-integer", "dep:num-traits", "dep:unicode-normalization"]

[dependencies]
# FR-275: the one exact kernel, owned by the QSL repository. Optional and enabled only by
# `exact`; spelled `branch = "main"` like every first-party dependency (IR-434).
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main", optional = true, default-features = false }
num-bigint = { version = "=0.4.8", optional = true, default-features = false }
num-integer = { version = "=0.1.47", optional = true, default-features = false }
num-traits = { version = "=0.2.19", optional = true, default-features = false }
unicode-normalization = { version = "=0.1.25", optional = true, default-features = false }
proptest = { version = "=1.5.0", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.228", optional = true, default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.151", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# CBMC tracks heap objects field-by-field only up to 64 bytes by default;
# `ValueType`, `Value` and `FunctionDeclaration` are larger, and a
# non-field-sensitive read of them cannot be constant-folded.
[package.metadata.kani]
unstable = { unstable-options = true }
flags = { cbmc-args = ["--max-field-sensitivity-array-size", "1024"] }
