name: CI

# Manual only. This workflow has never been dispatched. Local `make ci` is the gate.
on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: make lint

      - name: Test feature matrix
        run: make test-features

      - name: Validate specification
        run: |
          npm install --global '@agent-ix/quire-cli' '@agent-ix/quoin' '@agent-ix/ix-flow'
          quoin module ensure-defaults
          make spec

  msrv:
    name: MSRV surface and footprint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read declared MSRV
        id: msrv
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              print(f"version={tomllib.load(manifest)['package']['rust-version']}")
          PY
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: thumbv7em-none-eabi
      - name: Check full declared surface
        run: make msrv
      - name: Linked release footprint ceiling
        run: make size

  kani:
    name: Kani operator proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove truth tables and definedness boundaries
        uses: model-checking/kani-github-action@v1

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses
