name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test feature matrix
        run: |
          cargo test --no-default-features
          cargo test --features alloc
          cargo test --features std
          cargo test --all-features

      - name: Validate specification
        run: |
          npm install --global @agent-ix/quire-cli@0.31.0 @agent-ix/quoin@0.22.5
          quoin module ensure-defaults
          quire validate --scope . 'spec/**/*.md' 'planning/**/*.md' 'plan/**/*.md'

      - name: Unsafe audit
        run: bash scripts/check_unsafe_comments.sh

      - name: Panic-surface audit
        run: bash scripts/check_panic_surface.sh

      - name: Release footprint ceiling
        run: make size

  msrv:
    name: Rust 1.75 core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.75.0
      - name: Check dependency-free core
        run: cargo +1.75.0 check --lib --no-default-features

  kani:
    name: Kani operator proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove truth tables and definedness boundaries
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses
