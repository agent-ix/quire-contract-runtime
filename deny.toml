[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# First-party agent-ix crates are AGPL-3.0-or-later (owner decision 2026-09-14,
# agent-ix/quire-contract-runtime#14). Exceptions are scoped to this workspace's
# crates so the third-party allow-list stays permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-runtime" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-runtime-footprint" },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

# One copy of every first-party crate. Cargo treats each distinct git source spec
# (url + rev) as a separate package, so a stray `rev =`, a path/git split or a new
# repo cycle would build the same crate twice with mismatched types. cargo-deny
# matches exact names (no globs), so each qsl-* crate is listed. RT's graph holds
# only its own two crates today; the rest guard against a future dependency.
[[bans.deny]]
name = "quire-contract-runtime"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-contract-runtime-footprint"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-contract-model"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-contract-ir"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-verification-contracts"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-canonical"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-exact"
deny-multiple-versions = true

[[bans.deny]]
name = "quire-spec-language"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-attrs"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-cst"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-eval"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-forms"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-foundation"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-package"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-replay"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-route"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-semantics"
deny-multiple-versions = true

[[bans.deny]]
name = "qsl-source"
deny-multiple-versions = true

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
