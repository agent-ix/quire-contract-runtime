[package]
name = "quire-contract-runtime-footprint"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
quire-contract-runtime = { path = "../..", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
